name: Build desktop packages

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux x64
            os: ubuntu-24.04
            bundles: deb
            artifact: pudding-linux-x64
            path: src-tauri/target/release/bundle/deb/*.deb
          - name: macOS ARM64
            os: macos-14
            bundles: dmg
            artifact: pudding-macos-arm64
            path: src-tauri/target/release/bundle/dmg/*.dmg
          - name: Windows x64
            os: windows-2022
            bundles: nsis,msi
            artifact: pudding-windows-x64
            path: |
              src-tauri/target/release/bundle/nsis/*.exe
              src-tauri/target/release/bundle/msi/*.msi
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
      - name: Install Linux desktop libraries
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential libssl-dev librsvg2-dev libayatana-appindicator3-dev patchelf
      - run: npm ci
      - name: Build desktop packages
        run: npm run tauri -- build --ci --bundles ${{ matrix.bundles }} -- --locked
      - name: Upload packages
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.path }}
          if-no-files-found: error
