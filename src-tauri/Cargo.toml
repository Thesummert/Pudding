[package]
name = "pudding"
version = "0.1.0"
description = "A thoughtful cross-platform file manager"
authors = ["Pudding contributors"]
edition = "2021"
rust-version = "1.90"

[lib]
name = "pudding_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
notify = "8"
serde = { version = "1", features = ["derive"] }
dirs = "6"
trash = "5"
clipboard-rs = { version = "0.3", default-features = false }
drag = "2"
url = "2"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-app-kit = { version = "0.3", default-features = false, features = ["std", "NSPasteboard", "NSPasteboardItem"] }
objc2-foundation = { version = "0.3", default-features = false, features = ["std", "NSArray", "NSData", "NSString", "NSURL"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Storage_FileSystem"] }

[dev-dependencies]
tempfile = "3"
